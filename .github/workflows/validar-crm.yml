name: Validar CRM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 5
    steps:
      - name: Obter o commit do evento
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Conferir sintaxe
        run: node --check worker-completo.mjs
      - name: Testar API e auditoria com SQLite local
        run: node tests/fluxo.mjs
